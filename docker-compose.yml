version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidzflow-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidzflow_test
      POSTGRES_USER: vidzflow
      POSTGRES_PASSWORD: vidzflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidzflow -d vidzflow_test -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: vidzflow-test-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
