<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#008080" />
    <meta name="description" content="{% block meta_description %}Download TikTok videos without watermark, save Instagram reels and stories, and grab Facebook or YouTube videos in HD with this free online video downloader.{% endblock %}" />
    <meta name="keywords" content="TikTok video downloader, TikTok downloader without watermark, Instagram video downloader, Instagram reels downloader, Facebook video downloader, YouTube shorts downloader, online video downloader, HD video downloader, social media video downloader" />
    <meta name="robots" content="{% block robots %}index, follow{% endblock %}" />
    <meta name="author" content="ToxicDownloader" />
    <meta name="referrer" content="no-referrer" />
    <link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}" />
    <meta property="og:url" content="{{ request.url_root.rstrip('/') }}{{ request.path }}" />
    <meta property="og:title" content="{{ self.title() }}" />
    <meta property="og:description" content="{{ self.meta_description() }}" />
    <meta property="og:site_name" content="ToxicDownloader" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/image.png', v=2) }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ self.title() }}" />
    <meta name="twitter:description" content="{{ self.meta_description() }}" />
    <title>{% block title %}ToxicDownloader{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v=5" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="site-preloader" id="site-preloader" role="status" aria-live="polite" aria-label="Loading ToxicDownloader">
      <div class="preloader-orbit preloader-orbit-one"></div>
      <div class="preloader-orbit preloader-orbit-two"></div>
      <div class="preloader-stage">
        <div class="preloader-platform" aria-hidden="true"></div>
        <img class="preloader-logo" src="{{ url_for('static', filename='assets/image.png', v=2) }}" alt="ToxicDownloader social media video downloader logo" />
      </div>
      <div class="preloader-copy"><span>TOXIC</span><strong>DOWNLOADER</strong></div>
      <div class="preloader-progress" aria-hidden="true"><span></span></div>
    </div>
    <div class="background"></div>
    {% include 'components/navigation.html' %}
    <main class="main">
      {% block content %}{% endblock %}
    </main>
    {% include 'components/footer.html' %}
    <script src="{{ url_for('static', filename='js/site.js') }}?v=5" defer></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
