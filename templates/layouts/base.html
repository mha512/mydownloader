<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#008080" />
    <meta name="description" content="{% block meta_description %}ToxicDownloader lets you preview and download public media from supported platforms.{% endblock %}" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ToxicDownloader" />
    <title>{% block title %}ToxicDownloader{% endblock %}</title>
    <style>
      :root {
        --bg: #f5fbfb;
        --surface: #ffffff;
        --surface-soft: #eef7f7;
        --input: #f8fcfc;
        --text: #102a2a;
        --muted: #617878;
        --teal: #008080;
        --teal-strong: #00a6a6;
        --border: #d9e8e8;
        --success: #059669;
        --danger: #dc2626;
        --warning: #d97706;
        --shadow: 0 12px 38px rgba(0, 80, 80, 0.08);
        --nav: rgba(255, 255, 255, 0.9);
      }

      body.dark-mode {
        --bg: #071313;
        --surface: #0d1c1c;
        --surface-soft: #112525;
        --input: #091818;
        --text: #f0ffff;
        --muted: #9db8b8;
        --teal: #16a3a3;
        --teal-strong: #22baba;
        --border: #1d3939;
        --nav: rgba(13, 28, 28, 0.94);
        --shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        transition: background 0.2s ease, color 0.2s ease;
      }
      a { color: inherit; text-decoration: none; }
      img { max-width: 100%; display: block; }
      button, input { font: inherit; }

      .background {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 8% 8%, rgba(0, 128, 128, 0.12), transparent 28%),
                    radial-gradient(circle at 92% 18%, rgba(0, 166, 166, 0.08), transparent 30%);
        pointer-events: none;
        z-index: -1;
      }
      body.dark-mode .background {
        background: radial-gradient(circle at 8% 8%, rgba(0, 128, 128, 0.18), transparent 28%),
                    radial-gradient(circle at 92% 18%, rgba(0, 166, 166, 0.08), transparent 30%);
      }

      .container {
        width: min(100% - 32px, 1120px);
        margin: 0 auto;
      }

      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 72px;
        padding: 0 clamp(14px, 4vw, 55px);
        background: var(--nav);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--teal);
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--teal), var(--teal-strong));
        box-shadow: 0 8px 20px rgba(0, 128, 128, 0.22);
      }
      .brand-mark svg {
        width: 27px;
        height: 27px;
        fill: none;
        stroke: white;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .nav-link {
        padding: 9px 12px;
        border-radius: 9px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .nav-link:hover {
        color: var(--teal);
        background: var(--surface-soft);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .theme-toggle, .menu-btn {
        width: 42px;
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface);
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      .theme-toggle:hover, .menu-btn:hover {
        border-color: var(--teal);
        color: var(--teal);
        transform: translateY(-1px);
      }
      .theme-toggle svg, .menu-btn svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .menu-btn { display: none; }

      .mobile-menu {
        display: none;
        background: var(--nav);
        border-bottom: 1px solid var(--border);
        padding: 10px 14px;
      }
      .mobile-menu.open { display: grid; }
      .mobile-menu a {
        padding: 12px;
        border-radius: 10px;
        color: var(--muted);
        font-weight: 700;
      }
      .mobile-menu a:hover {
        background: var(--surface-soft);
        color: var(--teal);
      }

      .main {
        padding: 28px 0 56px;
      }

      .hero {
        text-align: center;
        padding: 48px 0 28px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--teal);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        box-shadow: var(--shadow);
      }
      .hero h1 {
        margin: 20px auto 0;
        max-width: 900px;
        font-size: clamp(2.4rem, 6vw, 4.6rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
        color: var(--text);
      }
      .hero h1 .gradient {
        background: linear-gradient(135deg, var(--teal), var(--teal-strong));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero p {
        max-width: 720px;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: 1.02rem;
      }

      .platform-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 22px;
      }
      .platform-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 13px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        box-shadow: var(--shadow);
      }
      .platform-pill svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: clamp(20px, 4vw, 34px);
        margin-bottom: 24px;
      }

      .section-kicker {
        color: var(--teal);
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      .section-heading {
        font-size: clamp(1.3rem, 2vw, 1.8rem);
        margin: 0 0 10px;
      }
      .section-copy {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .field label {
        font-size: 0.8rem;
        font-weight: 800;
      }
      .input {
        width: 100%;
        height: 56px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--input);
        color: var(--text);
        outline: none;
        padding: 0 16px;
        font-size: 0.92rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.09);
      }

      .btn {
        min-height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 19px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--teal), var(--teal-strong));
        color: #ffffff;
        font-size: 0.85rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(0, 128, 128, 0.18);
      }
      .btn.secondary {
        background: var(--surface-soft);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
      }
      .btn:hover { transform: translateY(-1px); }

      .status-box {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.82rem;
        font-weight: 650;
      }
      .status-box.error {
        color: var(--danger);
        background: rgba(220, 38, 38, 0.08);
        border: 1px solid rgba(220, 38, 38, 0.18);
      }
      .status-box.info {
        color: var(--warning);
        background: rgba(217, 119, 6, 0.08);
        border: 1px solid rgba(217, 119, 6, 0.18);
      }
      .status-box.success {
        color: var(--success);
        background: rgba(5, 150, 105, 0.08);
        border: 1px solid rgba(5, 150, 105, 0.18);
      }

      .meta-copy {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .legal-shell {
        max-width: 900px;
        margin: 0 auto;
      }
      .legal-hero {
        padding: 36px 0 24px;
      }
      .legal-hero h1 {
        margin: 10px 0 14px;
        font-size: clamp(2.3rem, 6vw, 4rem);
        line-height: 1.06;
        letter-spacing: -0.05em;
      }
      .legal-hero .lead {
        max-width: 720px;
        font-size: 1rem;
        color: var(--muted);
      }
      .legal-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: clamp(20px, 4vw, 38px);
      }
      .prose h2 {
        margin: 24px 0 8px;
        font-size: 1.25rem;
      }
      .prose p, .prose li {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .prose ul {
        padding-left: 1.2rem;
      }

      .footer {
        border-top: 1px solid var(--border);
        padding: 32px 0 42px;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .footer-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }
      .footer-links {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .footer-links a:hover {
        color: var(--teal);
      }

      @media (max-width: 860px) {
        .nav-links { display: none; }
        .menu-btn { display: grid; }
      }

      @media (max-width: 640px) {
        .container { width: min(100% - 18px, 1120px); }
        .form-grid { grid-template-columns: 1fr; }
        .btn { width: 100%; }
        .navbar { height: 64px; }
        .brand span:last-child { font-size: 0.98rem; }
        .brand-mark { width: 37px; height: 37px; }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="background"></div>
    {% include 'components/navigation.html' %}
    <main class="main">
      {% block content %}{% endblock %}
    </main>
    {% include 'components/footer.html' %}

    <script>
      function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        const themeIcon = document.getElementById('theme-icon');
        if (themeIcon) {
          themeIcon.innerHTML = isDark
            ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>'
            : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"></path></svg>';
        }
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#071313' : '#008080');
      }

      function toggleTheme() {
        const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
        localStorage.setItem('ToxicDownloader-theme', next);
        applyTheme(next);
      }

      function toggleMenu() {
        const menu = document.getElementById('mobile-menu');
        const button = document.getElementById('menu-button');
        if (!menu) return;
        const isOpen = menu.classList.toggle('open');
        button?.setAttribute('aria-expanded', String(isOpen));
      }

      document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('ToxicDownloader-theme') || 'light';
        applyTheme(savedTheme);
        document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
        document.getElementById('menu-button')?.addEventListener('click', toggleMenu);
        document.querySelectorAll('.mobile-menu a').forEach((link) => {
          link.addEventListener('click', () => {
            const menu = document.getElementById('mobile-menu');
            const button = document.getElementById('menu-button');
            menu?.classList.remove('open');
            button?.setAttribute('aria-expanded', 'false');
          });
        });
      });
    </script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
