<style>
  .home-card {
    max-width: 940px;
    margin-left: auto;
    margin-right: auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: clamp(20px, 4vw, 34px);
    margin-bottom: 24px;
  }

  .section-kicker {
    color: var(--teal);
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .section-heading {
    font-size: clamp(1.3rem, 2vw, 1.8rem);
    margin: 0 0 10px;
  }

  .section-copy {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 0.88rem;
  }

  .hero {
    text-align: center;
    padding: 48px 0 28px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--teal);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: var(--shadow);
  }

  .eyebrow svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hero h1 {
    margin: 20px auto 0;
    max-width: 900px;
    font-size: clamp(2.4rem, 6vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: -0.06em;
  }

  .hero h1 .gradient {
    background: linear-gradient(135deg, var(--teal), var(--teal-strong));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p {
    max-width: 720px;
    margin: 18px auto 0;
    color: var(--muted);
    font-size: 1.02rem;
  }

  .platform-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 22px;
  }

  .platform-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.76rem;
    font-weight: 700;
    box-shadow: var(--shadow);
  }

  .platform-pill svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field label {
    font-size: 0.8rem;
    font-weight: 800;
  }

  .input {
    width: 100%;
    height: 56px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--input);
    color: var(--text);
    outline: none;
    padding: 0 16px;
    font-size: 0.92rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.09);
  }

  .btn {
    min-height: 56px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 19px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--teal), var(--teal-strong));
    color: #ffffff;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0, 128, 128, 0.18);
  }

  .btn.secondary {
    background: var(--surface-soft);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }

  .btn:hover {
    transform: translateY(-1px);
  }

  .status-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.82rem;
    font-weight: 650;
  }

  .status-box.error {
    color: var(--danger);
    background: rgba(220, 38, 38, 0.08);
    border: 1px solid rgba(220, 38, 38, 0.18);
  }

  .status-box.info {
    color: var(--warning);
    background: rgba(217, 119, 6, 0.08);
    border: 1px solid rgba(217, 119, 6, 0.18);
  }

  .status-box.success {
    color: var(--success);
    background: rgba(5, 150, 105, 0.08);
    border: 1px solid rgba(5, 150, 105, 0.18);
  }

  .meta-copy {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.72rem;
  }

  .preview {
    display: none;
    margin-top: 22px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface-soft);
    overflow: hidden;
  }

  .preview.show {
    display: grid;
    grid-template-columns: 280px 1fr;
  }

  .thumb-wrap {
    background: #071313;
    min-height: 190px;
    position: relative;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    min-height: 190px;
    object-fit: cover;
    display: block;
  }

  .thumb-placeholder {
    height: 100%;
    min-height: 190px;
    display: grid;
    place-items: center;
    color: #ffffff;
  }

  .thumb-placeholder svg {
    width: 48px;
    height: 48px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .preview-body {
    padding: 20px;
  }

  .preview-title {
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .preview-meta {
    color: var(--muted);
    font-size: 0.76rem;
    margin-bottom: 17px;
  }

  .quality-title {
    font-size: 0.77rem;
    font-weight: 800;
    margin-bottom: 9px;
  }

  .qualities {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .quality {
    min-width: 100px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
  }

  .quality:hover,
  .quality.active {
    border-color: var(--teal);
    background: rgba(0, 128, 128, 0.06);
    color: var(--teal);
  }

  .quality strong {
    display: block;
    font-size: 0.8rem;
  }

  .quality small {
    display: block;
    color: var(--muted);
    font-size: 0.65rem;
    margin-top: 2px;
  }

  .preview-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 17px;
  }

  .download-result {
    display: none;
    margin-top: 18px;
    padding: 17px;
    border: 1px solid rgba(5, 150, 105, 0.2);
    border-radius: 15px;
    background: rgba(5, 150, 105, 0.06);
  }

  .download-result.show {
    display: block;
  }

  .download-result p {
    font-size: 0.75rem;
    color: var(--muted);
    margin: 4px 0 12px;
  }

  .download-progress {
    display: none;
    margin-top: 12px;
  }

  .download-progress.show {
    display: block;
  }

  .download-progress.indeterminate .progress-bar {
    width: 35%;
    animation: progress-indeterminate 1.4s ease-in-out infinite;
  }

  .progress-track {
    height: 8px;
    border-radius: 99px;
    background: var(--border);
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--teal), var(--teal-strong));
  }

  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 7px;
    color: var(--muted);
    font-size: 0.72rem;
  }

  .recovery-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .spinner {
    width: 15px;
    height: 15px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes progress-indeterminate {
    from { transform: translateX(-120%); }
    to { transform: translateX(330%); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .feature {
    padding: 22px 17px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .feature-icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: rgba(0, 128, 128, 0.08);
    margin-bottom: 12px;
  }

  .feature-icon svg {
    width: 23px;
    height: 23px;
    stroke: var(--teal);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .feature h3 {
    font-size: 0.9rem;
    margin-bottom: 5px;
  }

  .feature p {
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.6;
  }

  .content-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 24px;
  }

  .prose p,
  .prose li {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .faq {
    display: grid;
    gap: 9px;
  }

  .faq details {
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--surface-soft);
    padding: 13px 15px;
  }

  .faq summary {
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 750;
  }

  .faq p {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 0.76rem;
  }

  .ad-slot {
    min-height: 90px;
    margin: 22px 0;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: var(--surface-soft);
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 0.7rem;
  }

  .ad-slot span {
    opacity: 0.65;
  }

  @media (max-width: 860px) {
    .feature-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .content-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    .form-grid {
      grid-template-columns: 1fr;
    }

    .btn {
      width: 100%;
    }

    .preview.show {
      display: block;
    }

    .thumb-wrap,
    .thumb-wrap img,
    .thumb-placeholder {
      min-height: 205px;
      height: 205px;
    }

    .preview-body {
      padding: 16px;
    }

    .quality {
      flex: 1 1 calc(50% - 8px);
      min-width: 0;
    }

    .feature-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 380px) {
    .quality {
      flex-basis: 100%;
    }
  }
</style>
