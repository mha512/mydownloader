<header class="hero">
  <h1><span class="gradient">Social Media Video Downloader</span></h1>
  <p>Preview publicly accessible content, choose an available video quality, and download it from one clean, mobile-friendly interface.</p>
  <div class="platform-row" aria-label="Supported platforms">
    {% for platform in platforms %}
      <a class="platform-pill" href="{{ url_for('platform_page', platform_slug=platform.slug) }}">{{ platform.name }}</a>
    {% endfor %}
  </div>
</header>
