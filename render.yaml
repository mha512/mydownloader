services:
  - type: web
    name: vidzflow-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && gunicorn --bind 0.0.0.0:$PORT --workers 2 --access-logfile - app:app"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidzflow-db
          property: connectionString
      - key: VIDZFLOW_SECRET_KEY
        sync: false
      - key: METRICS_AUTH_TOKEN
        sync: false
      - key: VIDZFLOW_MAX_REQUEST_BYTES
        value: "65536"
      - key: RATE_LIMIT_CAPACITY
        value: "20"
      - key: RATE_LIMIT_REFILL_SECONDS
        value: "60"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"

  - type: worker
    name: vidzflow-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && python worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidzflow-db
          property: connectionString
      - key: VIDZFLOW_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PRESIGNED_URL_SECONDS
        value: "1800"
      - key: JOB_RETENTION_SECONDS
        value: "1800"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: WORKER_JOB_TIMEOUT_SECONDS
        value: "900"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: MAX_DOWNLOAD_BYTES
        value: "524288000"
      - key: MAX_TEMP_DISK_BYTES
        value: "1073741824"
      - key: MIN_FREE_DISK_BYTES
        value: "268435456"

databases:
  - name: vidzflow-db
    plan: starter
